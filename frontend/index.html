<!doctype html>
<html lang="pt-BR" class="dark">
  <head>
    <meta charset="UTF-8" />

    <!-- PWA: Ícones e Manifest -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- PWA: Viewport e comportamento mobile -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="MeuDino" />

    <!-- PWA: Cor da barra de status no Android Chrome -->
    <meta name="theme-color" content="#0a0a0f" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f8fafc" media="(prefers-color-scheme: light)" />

    <!-- SEO -->
    <title>MeuDino — Seu Gerenciador Financeiro Inteligente</title>
    <meta name="description" content="MeuDino: Controle financeiro inteligente. Registre seus gastos por texto ou áudio no WhatsApp e Telegram com IA. Funciona offline e sincroniza automaticamente." />
    <meta name="keywords" content="meudino, finanças pessoais, controle financeiro, whatsapp, inteligência artificial, app financeiro" />

    <!-- Open Graph (WhatsApp / Telegram share preview) -->
    <meta property="og:title" content="MeuDino — Seu Gerenciador Financeiro Inteligente" />
    <meta property="og:description" content="MeuDino: Controle financeiro via WhatsApp e Telegram com IA. Funciona offline." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/icon-512x512.png" />

    <!-- Google Fonts: Inter + JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />

    <!-- Google AdSense — bloqueado até consentimento de marketing (LGPD)
         O hook useConsent ativa este script apenas quando o usuário aceitar
         cookies de "marketing". type="text/plain" impede execução imediata. -->
    <script
      type="text/plain"
      data-consent-type="marketing"
      data-src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js"
      crossorigin="anonymous"
    ></script>
  </head>
  <body class="bg-background text-din-text font-sans antialiased min-h-screen selection:bg-din-primary selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
